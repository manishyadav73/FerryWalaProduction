# One-command stack: MySQL + backend + web. Copy .env.example to .env and fill it in first.
#   docker compose up --build
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ferrywala
      MYSQL_USER: ferrywala
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend/backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/ferrywala?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ferrywala
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 random characters)}
      TRUST_PROXY: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8081}
      APP_PUBLIC_API_URL: ${APP_PUBLIC_API_URL:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-FerryWala <no-reply@example.com>}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      DEMAND_TIME_ZONE: ${DEMAND_TIME_ZONE:-Asia/Kolkata}
      CONCIERGE_NAME: ${CONCIERGE_NAME:-AI Concierge}
      CONCIERGE_LLM_API_KEY: ${CONCIERGE_LLM_API_KEY:-}
      CONCIERGE_LLM_MODEL: ${CONCIERGE_LLM_MODEL:-}
      CONCIERGE_LLM_BASE_URL: ${CONCIERGE_LLM_BASE_URL:-}
      CONCIERGE_LLM_TIMEOUT_MS: ${CONCIERGE_LLM_TIMEOUT_MS:-8000}
      CONCIERGE_RETENTION_DAYS: ${CONCIERGE_RETENTION_DAYS:-30}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-}
    volumes:
      - uploads:/data/uploads

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8081}:80"

volumes:
  dbdata:
  uploads:
