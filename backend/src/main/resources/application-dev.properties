
# Local Development - MySQL

spring.datasource.url=jdbc:mysql://localhost:3306/ferrywala
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173

# Application URLs
app.public-url=http://localhost:5173

# Email Configuration
app.mail.from=${MAIL_FROM}

# Email Verification
app.auth.require-email-verification=true

# Server
server.port=8080
server.error.include-message=always

# Logging
logging.level.backend=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.boot.autoconfigure.mail=DEBUG
spring.mail.properties.mail.debug=true
