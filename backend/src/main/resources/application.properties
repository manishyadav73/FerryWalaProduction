# ---------------------------------------------------------------------------
# FerryWala backend - base (production-safe) configuration.
#
# Nothing secret lives in this file. Required values come from environment
# variables; the app refuses to start if they are missing. For local work use
# the "dev" profile:   SPRING_PROFILES_ACTIVE=dev
# See /.env.example for the full list.
# ---------------------------------------------------------------------------
spring.application.name=ferrywala
server.port=${PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# --- Database (required) ---------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# --- JSON ------------------------------------------------------------------
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- Uploads ---------------------------------------------------------------
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
app.upload-dir=${UPLOAD_DIR:./uploads}
app.upload.max-bytes=2097152

# --- Security --------------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.trust-proxy=${TRUST_PROXY:false}
app.auth.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:false}

# --- Public URLs (used inside emails and image links) ----------------------
app.public-url=${APP_PUBLIC_URL:http://localhost:5173}
app.public-api-url=${APP_PUBLIC_API_URL:}

# --- Bootstrap admin (optional): created once if the email does not exist --
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# --- Email -----------------------------------------------------------------
# Mail is OFF unless SPRING_MAIL_HOST is set (Spring Boot reads
# SPRING_MAIL_HOST / _PORT / _USERNAME / _PASSWORD from the environment).
app.mail.from=${MAIL_FROM:FerryWala <no-reply@ferrywala.local>}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- AI Concierge ----------------------------------------------------------
# Works out of the box on built-in rules. The language-model rewrite is ON only when BOTH the
# API key and the model name are set. The key stays on the server and is never sent to browsers.
app.concierge.name=${CONCIERGE_NAME:FerryWala AI Concierge}
app.concierge.llm.api-key=${CONCIERGE_LLM_API_KEY:}
app.concierge.llm.model=${CONCIERGE_LLM_MODEL:}
app.concierge.llm.base-url=${CONCIERGE_LLM_BASE_URL:https://api.anthropic.com}
app.concierge.llm.timeout-ms=${CONCIERGE_LLM_TIMEOUT_MS:8000}
app.concierge.retention-days=${CONCIERGE_RETENTION_DAYS:30}
# Shown in the Concierge when set; leave empty to show nothing.
app.support.email=${SUPPORT_EMAIL:}
app.support.phone=${SUPPORT_PHONE:}

# --- Demand engine ---------------------------------------------------------
app.demand.zone=${DEMAND_TIME_ZONE:Asia/Kolkata}

# --- Actuator: expose health only ------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
